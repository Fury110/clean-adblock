<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CleanBlock</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      width: 210px;
      background: #ffffff;
      padding: 20px 16px;
      user-select: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* Minimal Header */
    .brand {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 24px;
    }

    .brand img {
      width: 18px;
      height: 18px;
    }

    .brand span {
      font-size: 13px;
      font-weight: 600;
      color: #18181b;
      letter-spacing: -0.2px;
    }

    /* Ultra Smooth Switch */
    .switch-container {
      position: relative;
      cursor: pointer;
      margin-bottom: 16px;
    }

    .switch-track {
      width: 80px;
      height: 46px;
      background: #e4e4e7;
      border-radius: 9999px;
      padding: 4px;
      transition: background-color 0.35s cubic-bezier(0.16, 1, 0.3, 1),
                  box-shadow 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      position: relative;
    }

    .switch-thumb {
      width: 38px;
      height: 38px;
      background: #ffffff;
      border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12), 0 1px 2px rgba(0, 0, 0, 0.08);
      transform: translateX(0);
      transition: transform 0.4s cubic-bezier(0.34, 1.4, 0.64, 1),
                  box-shadow 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .switch-thumb svg {
      width: 18px;
      height: 18px;
      stroke: #a1a1aa;
      stroke-width: 2.2;
      fill: none;
      transition: stroke 0.3s ease, transform 0.3s ease;
    }

    /* Active / Protected State */
    .switch-container.active .switch-track {
      background: #10b981;
      box-shadow: 0 4px 16px rgba(16, 185, 129, 0.28);
    }

    .switch-container.active .switch-thumb {
      transform: translateX(34px);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
    }

    .switch-container.active .switch-thumb svg {
      stroke: #10b981;
      transform: rotate(360deg);
    }

    .switch-container:active .switch-thumb {
      width: 42px;
    }

    /* Status Label */
    .status-label {
      font-size: 13px;
      font-weight: 500;
      color: #71717a;
      transition: color 0.3s ease;
    }

    .status-label.active {
      color: #059669;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="brand">
    <img src="../icons/adblock-32.png" alt="CleanBlock">
    <span>CleanBlock</span>
  </div>

  <div class="switch-container active" id="toggle-switch">
    <div class="switch-track">
      <div class="switch-thumb">
        <svg viewBox="0 0 24 24">
          <path d="M12 2v10M18.36 6.64a9 9 0 1 1-12.73 0"></path>
        </svg>
      </div>
    </div>
  </div>

  <div class="status-label active" id="status-label">Protected</div>

  <script src="popup.js"></script>
</body>
</html>
